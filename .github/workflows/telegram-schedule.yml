name: Telegram Scheduled Messages

on:
  schedule:
    - cron: "0 21 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check execution time
        run: |
          echo "UTC time:"
          date -u
          echo "India time:"
          TZ=Asia/Kolkata date
          echo "Trigger event: $GITHUB_EVENT_NAME"

      - name: Send Telegram messages
        run: python scheduled_sender.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_SELF: ${{ secrets.TELEGRAM_CHAT_ID_SELF }}
          TELEGRAM_CHAT_ID_FRIEND: ${{ secrets.TELEGRAM_CHAT_ID_FRIEND }}
          TELEGRAM_MESSAGE: ${{ vars.TELEGRAM_MESSAGE }}
